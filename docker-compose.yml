version: '3.8'

services:
  # MongoDB service
  mongodb:
    image: mongo:6.0-jammy
    container_name: surgecart_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - surgecart_net
    restart: unless-stopped

  # Redis service
  redis:
    image: redis:7.2-alpine
    container_name: surgecart_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - surgecart_net
    restart: unless-stopped
    command: redis-server --appendonly yes --notify-keyspace-events Ex

  # Backend Node Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: surgecart_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/surgecart
      - REDIS_URI=redis://redis:6379
      - JWT_SECRET=prod_secret_jwt_key_change_me_in_ci
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost
      # Stripe keys will need to be configured in production/development env file overrides
      - STRIPE_SECRET_KEY=sk_test_placeholder
      - STRIPE_WEBHOOK_SECRET=whsec_placeholder
    depends_on:
      - mongodb
      - redis
    networks:
      - surgecart_net
    restart: unless-stopped

  # Frontend Client (Nginx wrapper)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: surgecart_frontend
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - surgecart_net
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:

networks:
  surgecart_net:
    driver: bridge
