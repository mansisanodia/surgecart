name: SurgeCart CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-size: '20'
          cache: 'npm'

      - name: Install Root & Workspace Dependencies
        run: npm ci

      # Backend Checks
      - name: Build Backend (TypeScript compile)
        run: |
          cd server
          npm run build

      # Frontend Checks
      - name: Build Frontend (React + Vite compilation)
        run: |
          cd client
          npm run build
